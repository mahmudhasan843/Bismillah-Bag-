
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিসমিল্লাহ ব্যাগ পোর্টাল | ৫ডি লাক্সারি কালেকশন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-accent: #fff5f7;
            --rose-primary: #e11d48;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: var(--bg-accent);
            min-height: 100vh;
        }

        /* 5D Unique Background Container */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: 
                radial-gradient(at 0% 0%, hsla(343, 100%, 98%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(20, 100%, 97%, 1) 0, transparent 50%),
                radial-gradient(at 50% 50%, hsla(355, 100%, 94%, 1) 0, transparent 100%);
        }

        /* 5D Bag Element - The "Uncommon" Factor */
        .five-d-bag {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh;
            height: 80vh;
            opacity: 0.15;
            pointer-events: none;
            filter: drop-shadow(0 20px 50px rgba(225, 29, 72, 0.2));
            animation: zoomAndBreath 15s infinite alternate ease-in-out;
            background-image: url('https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&q=100&w=1200');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: -1;
        }

        /* Subtle Floating Lights */
        .floating-light {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(225, 29, 72, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
        }

        @keyframes zoomAndBreath {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-48%, -52%) scale(1.1) rotate(5deg); }
            100% { transform: translate(-52%, -48%) scale(1.05) rotate(-3deg); }
        }

        /* Glassmorphism Classes */
        .glass-card {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(15px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(15px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 8px 32px 0 rgba(225, 29, 72, 0.05) !important;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important;
        }

        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }

        /* Hide Scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(225, 29, 72, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(225, 29, 72, 0.4); }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <!-- Unique Background Elements -->
    <div class="bg-container">
        <div class="five-d-bag" id="parallax-bag"></div>
        <div class="floating-light" style="top: -100px; left: -100px;"></div>
        <div class="floating-light" style="bottom: -100px; right: -100px;"></div>
    </div>

    <div id="root"></div>

    <script>
        // Interactive 5D Parallax Script
        document.addEventListener('mousemove', (e) => {
            const bag = document.getElementById('parallax-bag');
            if (!bag) return;
            
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            
            bag.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) scale(${1 + Math.abs(moveX)/500})`;
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
